name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build

      - name: Build
        run: cmake --build cpp/build --config Release -- -j

      - name: Run tests
        run: ctest --test-dir cpp/build --output-on-failure -j 2
